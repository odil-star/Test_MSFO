<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Тест по МСФО</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app">
    <section class="hero" id="homeScreen">
      <h1>Тест по МСФО</h1>
      <p>Выберите блок. В каждом блоке 25 вопросов, 1 правильный ответ и 3 неправильных.</p>
      <div class="blocks" id="blocks"></div>
      <button id="ratingBtn" class="rating-btn">
        🏆 Топ рейтинг
      </button>
    </section>

    <section class="quiz hidden" id="quizScreen">
      <div class="quiz-top">
        <button class="back-btn" id="backBtn">← Выбрать другой блок</button>
        <p class="progress" id="progress"></p>
      </div>

      <div class="card">
        <h2 id="question"></h2>
        <div class="answers" id="answers"></div>
        <button class="next-btn hidden" id="nextBtn">Следующий вопрос</button>
      </div>
    </section>

    <section class="result hidden" id="resultScreen">

      <div class="result-card">

        <h2 id="resultTitle"></h2>

        <p id="resultText"></p>

        <img id="resultImage" alt="Результат теста" />

        <div class="result-actions">
          <button id="restartBtn">
            Пройти заново
          </button>

          <button id="chooseBtn">
            Выбрать другой блок
          </button>
        </div>

        <div class="thanks">
          <h3>Отблагодарить создателя</h3>

          <p>Humo: 9860 0201 2038 5586</p>

          <button onclick="copyCard()" class="copy-btn">
            Скопировать карту
          </button>
        </div>

        <div class="leaderboard">
          <h3 class="leaderboard-title">
            🏆 Топ пользователей
          </h3>

          <div id="leaders"></div>
        </div>

      </div>

    </section>

    <section class="rating hidden" id="ratingScreen">
      <button id="ratingBackBtn" class="back-btn">
        ← Назад
      </button>

      <h2>🏆 Топ рейтинг по блокам</h2>

      <div id="allLeaders"></div>
    </section>

  </main>

  <script type="module" src="script.js"></script>
</body>

</html>

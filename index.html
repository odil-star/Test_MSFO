<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Тест по МСФО</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="hero" id="homeScreen">
      <h1>Тест по МСФО</h1>
      <p>Выберите блок. В каждом блоке 25 вопросов, 1 правильный ответ и 3 неправильных.</p>
      <div class="blocks" id="blocks"></div>
    </section>

    <section class="quiz hidden" id="quizScreen">
      <div class="quiz-top">
        <button class="back-btn" id="backBtn">← Выбрать другой блок</button>
        <p class="progress" id="progress"></p>
      </div>

      <div class="card">
        <h2 id="question"></h2>
        <div class="answers" id="answers"></div>
        <button class="next-btn hidden" id="nextBtn">Следующий вопрос</button>
      </div>
    </section>

    <section class="result hidden" id="resultScreen">
      <div class="result-card">
        <h2 id="resultTitle"></h2>
        <p id="resultText"></p>
        <img id="resultImage" alt="Результат теста" />
        <div class="result-actions">
          <button id="restartBtn">Пройти заново</button>
          <button id="chooseBtn">Выбрать другой блок</button>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
